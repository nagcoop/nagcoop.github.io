name: Publish article

on:
  schedule:
    - cron: "29 10 * * 1"   # every Monday, 07:29 Brasilia
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave empty to pick from today's news)"
        required: false
        default: ""

permissions:
  contents: write
  models: read            # free GitHub Models, no API key

concurrency:
  group: site-bots
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write article (GitHub Models)
        id: draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: python scripts/write_article.py

      - name: Publish to the site
        env:
          TITLE: ${{ steps.draft.outputs.title }}
        run: |
          git config user.name  "nagcoop-article-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "Article: $TITLE"
          git pull --rebase origin main
          git push
