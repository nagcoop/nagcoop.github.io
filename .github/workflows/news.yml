name: Atualizar notícias

on:
  schedule:
    - cron: "0 10 * * *"   # todo dia às 7h (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar notícias
        run: python scripts/fetch_news.py

      - name: Publicar news.json
        run: |
          git config user.name  "nagcoop-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "Sem notícias novas."
          else
            git commit -m "Notícias $(date -u +%Y-%m-%d)"
            git push
          fi
