:root{
  --bg:#0b0f12; --panel:#12171d; --muted:#9aa4af;
  --brand:#ffd166; --line:#9f1239; --ar: 4 / 3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:#e5e7eb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial}
a{color:#ffd166;text-decoration:none}
.wrap{max-width:1200px;margin:auto;padding:16px}
header{border-bottom:2px solid var(--line);background:linear-gradient(180deg,rgba(159,18,57,.15),transparent)}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-family:'Metal Mania',cursive;color:var(--brand);margin:0}
.brand img{height:48px;border:2px solid var(--line);border-radius:8px}
nav a{margin-left:16px}
nav a[aria-current="page"]{text-decoration:underline;text-underline-offset:6px}
.panel{background:var(--panel);border:1px solid #222a33;border-radius:12px;padding:14px;margin-bottom:14px}
.muted{color:var(--muted);font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.btn{padding:9px 14px;border-radius:10px;border:1px solid #2a3340;background:#171e26;color:#e5e7eb;cursor:pointer;transition:all .12s ease;font:inherit}
.btn:hover{transform:translateY(-1px);border-color:#3a4555}
.btn.primary{background:linear-gradient(180deg,#9f1239,#6b0e28);border-color:#9f1239}
.btn.primary:hover{box-shadow:0 0 18px rgba(159,18,57,.5)}
select,input[type="file"],input[type="url"],input[type="text"]{background:#0f141a;color:#e5e7eb;border:1px solid #2a3340;border-radius:10px;padding:9px 10px;font:inherit}
input[type="range"]{accent-color:#ffd166}

.cat-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.cat-title{font-family:'Metal Mania',cursive;color:var(--brand);margin:0;font-size:1.6rem}
.search-box{flex:1;min-width:200px;max-width:320px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{padding:6px 12px;border-radius:999px;border:1px solid #2a3340;background:#0f141a;color:var(--muted);cursor:pointer;font-size:.85rem;transition:all .12s ease}
.chip:hover{border-color:#9f1239;color:#fff}
.chip.active{background:#9f1239;color:#fff;border-color:#9f1239}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:#0f141a;border:1px solid #2a3340;border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:all .15s ease;position:relative}
.card:hover{transform:translateY(-3px);border-color:#ffd166;box-shadow:0 6px 20px rgba(255,209,102,.15)}
.cover{aspect-ratio:3/4;background:#000;display:flex;align-items:center;justify-content:center;font-family:'Metal Mania',cursive;font-size:1.4rem;color:#fff;text-align:center;padding:14px;position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.placeholder{background:linear-gradient(135deg,#9f1239 0%,#6b0e28 50%,#1a0608 100%);box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
.cover.placeholder::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.2) 2px 3px);pointer-events:none}
